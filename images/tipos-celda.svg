<svg viewBox="0 0 700 220" xmlns="http://www.w3.org/2000/svg" font-family="Arial, sans-serif">
  <text x="20" y="25" font-size="14" font-weight="bold" fill="#2C5F8A">Celda de código</text>
  <rect x="20" y="35" width="300" height="70" rx="8" fill="#F0F4F8" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="35" y="60" font-size="13" font-family="monospace" fill="#1F2937">x = 5</text>
  <text x="35" y="80" font-size="13" font-family="monospace" fill="#1F2937">print(x * 2)</text>
  <rect x="20" y="112" width="300" height="35" rx="6" fill="#FFFFFF" stroke="#D6DCE2" stroke-width="1"/>
  <text x="35" y="134" font-size="12" fill="#6B7280">Out: 10</text>
  <text x="20" y="180" font-size="11" fill="#6B7280">Se ejecuta y muestra el resultado</text>

  <text x="380" y="25" font-size="14" font-weight="bold" fill="#1B7A5C">Celda de texto (Markdown)</text>
  <rect x="380" y="35" width="300" height="112" rx="8" fill="#FFFFFF" stroke="#9AA5B1" stroke-width="1.5"/>
  <text x="395" y="60" font-size="15" font-weight="bold" fill="#1F2937"># Título</text>
  <text x="395" y="82" font-size="12" fill="#1F2937">Texto explicativo, **negritas**,</text>
  <text x="395" y="100" font-size="12" fill="#1F2937">listas, ecuaciones LaTeX, etc.</text>
  <text x="380" y="180" font-size="11" fill="#6B7280">Se renderiza como texto formateado</text>
</svg>
