name: Verificar enlaces

# Flujo independiente: NO bloquea la publicación del sitio.
# Corre cada lunes y a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  enlaces:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - name: Descargar el sitio ya publicado (rama gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: sitio

      - name: Descargar configuración del verificador
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          sparse-checkout: lychee.toml
          sparse-checkout-cone-mode: false

      - name: Revisar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config repo/lychee.toml
            --root-dir ${{ github.workspace }}/sitio
            --no-progress
            'sitio/**/*.html'
          output: ./reporte-enlaces.md
          fail: false

      # lychee termina con 0 si todo está bien y con 2 si encontró enlaces rotos.
      # Cualquier otro código significa que el verificador mismo falló (por ejemplo,
      # un error de configuración): se marca el flujo en rojo y NO se abre un aviso vacío.
      - name: Fallar si el verificador no pudo ejecutarse
        if: steps.lychee.outputs.exit_code != 0 && steps.lychee.outputs.exit_code != 2
        run: |
          echo "lychee terminó con el código ${{ steps.lychee.outputs.exit_code }}: revisa el paso «Revisar enlaces»."
          exit 1

      - name: Abrir o actualizar un aviso si hay enlaces rotos
        if: steps.lychee.outputs.exit_code == 2
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Enlaces rotos detectados
          content-filepath: ./reporte-enlaces.md
          labels: enlaces
