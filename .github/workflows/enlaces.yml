name: Verificar enlaces

# Flujo independiente: NO bloquea la publicación del sitio.
# Corre cada lunes y a mano desde la pestaña Actions.
on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

jobs:
  enlaces:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Descargar el sitio ya publicado (rama gh-pages)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: sitio

      - name: Descargar configuración del verificador
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo
          sparse-checkout: lychee.toml
          sparse-checkout-cone-mode: false

      - name: Revisar enlaces
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --config repo/lychee.toml
            --root-dir ${{ github.workspace }}/sitio
            --no-progress
            'sitio/**/*.html'
          output: ./reporte-enlaces.md
          fail: false

      - name: Abrir o actualizar un aviso si hay enlaces rotos
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Enlaces rotos detectados
          content-filepath: ./reporte-enlaces.md
          labels: enlaces
