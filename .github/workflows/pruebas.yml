name: Pruebas de ejercicios

# Ejecuta de verdad los ejercicios de ingeniería en Python, R y Julia
# y comprueba que los tres den los mismos resultados. También ejecuta los ejercicios
# de los temas 01 a 06 y comprueba que pasen sus propias aserciones.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - 'python/07-ejercicios-ingenieria.qmd'
      - 'r/07-ejercicios-ingenieria.qmd'
      - 'julia/07-ejercicios-ingenieria.qmd'
      - 'python/0*.ipynb'
      - 'r/0*.ipynb'
      - 'julia/0*.qmd'
      - 'tests/**'
      - '.github/workflows/pruebas.yml'
  workflow_dispatch:

jobs:
  comparar:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar NumPy (lo usa el tema 06 de Python)
        run: pip install numpy

      - name: Instalar R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar Julia
        uses: julia-actions/setup-julia@v2
        with:
          version: '1'

      - name: Comparar los tres lenguajes
        run: python tests/probar_ejercicios.py --exigir-todos

      - name: Ejecutar los ejercicios de los temas 01 a 06
        run: python tests/probar_temas.py --exigir-todos
